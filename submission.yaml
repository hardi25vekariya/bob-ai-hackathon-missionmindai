submission:
  title: "AeroGuard-Bob: HUMS Mission-Readiness & Predictive Maintenance Copilot"
  problem_statement: "Modern military aviation incurs over $90 billion annually in maintenance expenditures, yet fleets routinely suffer mission aborts and degraded readiness due to rigid, calendar-based maintenance schedules. Flight-line maintenance officers and mission planners are overwhelmed by unanalyzed Health and Usage Monitoring Systems (HUMS) sensor feeds and siloed historical maintenance logs. Without real-time automated triage, ground crews cannot rapidly determine which grounded aircraft to repair first under tight crew and spare-parts constraints. This operational friction delays sortie generation and leaves commanders without grounded, audit-ready visibility into squadron mission readiness."
  solution_summary: "AeroGuard-Bob is an explainable, end-to-end mission-readiness and predictive maintenance copilot built for military aviation squadrons. It ingests real-time airframe telemetry and 2-year maintenance records across 25 fighter aircraft, classifies operational readiness with plain-language diagnostics, and calculates explainable subsystem failure risk scores (0–100). A greedy maintenance optimizer dynamically allocates available technician crews and spare parts to schedule urgent repairs while clearly logging bottleneck causes for queued jets. The entire pipeline is exposed via the Model Context Protocol (MCP) to IBM Bob, enabling commanders to query fleet health, investigate specific tail numbers, and generate constrained maintenance plans in natural language."
  key_features:
    - "Multi-Source Data Fusion: Seamlessly joins real-time HUMS sensor telemetry (vibration, engine temperature, oil quality index, flight cycles, inspection age) with historical maintenance event logs across 25 fighter aircraft located in src/data/."
    - "Automated Mission-Readiness Classifier: Evaluates sensor limits and maintenance deadlines in src/pipeline/readiness_classifier.py to classify assets as READY or NON-READY (currently 9 ready, 16 non-ready) with grounded plain-language explanations."
    - "Explainable Subsystem Failure Predictor: Computes quantifiable 0–100 risk scores across 5 critical subsystems (engine, hydraulics, fuel system, landing gear, avionics) in src/pipeline/failure_predictor.py by weighting sensor stress, recurring repair frequency, and airframe wear."
    - "Resource-Constrained Maintenance Optimizer: Greedily allocates available technician teams and spare parts inventory in src/pipeline/maintenance_planner.py, scheduling urgent repairs while diagnosing exact stockout bottlenecks for queued aircraft."
    - "IBM Bob MCP Tool Integration: Implements standard Model Context Protocol tools (get_fleet_readiness, get_asset_risk, get_maintenance_plan) in src/mcp/mcp_server.py over JSON-RPC 2.0 stdio for zero-hallucination conversational decision support."
