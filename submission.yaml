submission:
  title: "Mission Readiness & Predictive Maintenance Copilot"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
   Military organizations cannot reliably determine whether aircraft, vehicles,
    and equipment are mission-ready because maintenance runs on fixed calendar
    schedules instead of actual component condition. HUMS (Health & Usage
    Monitoring System) sensor data that could predict failures weeks in advance
    goes unanalyzed, causing unexpected failures, reduced operational readiness,
    and multi-week recovery times.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
 Our copilot ingests HUMS sensor data and analyzes it with AI to predict
    component failures before they happen, shifting maintenance from fixed
    calendar schedules to condition-based, predictive scheduling — improving
    mission readiness and reducing costly unplanned downtime.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Predictive failure detection from HUMS sensor data using AI/ML models"
    - "Condition-based maintenance scheduling instead of fixed calendar intervals"
    - "Mission-readiness scoring for aircraft/vehicles/equipment"
    - "Natural language maintenance recommendations via conversational copilot"
    - "Early-warning alerts weeks in advance of predicted failure"                              # optional 5th

  tech_stack:
    languages: []                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: []                     # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
   The predictive model turns raw HUMS sensor data into actionable,
    weeks-ahead failure predictions — directly targeting the $90B/year the
    military spends on maintenance and showing how shifting to a predictive
    approach can save billions.

  known_limitations: >                 # Optional but recommended — be honest about gaps
   The model is trained/tested on a limited dataset and has not been
    validated against real HUMS data at scale; predictions should be treated
    as decision support, not a replacement for maintenance inspections.

